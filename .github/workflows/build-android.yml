
name: Aether Arena - Android Build

on:
  workflow_dispatch:
  push:
    paths:
      - "AetherArena_Phone_Build.zip"
      - ".github/workflows/build-android.yml"

permissions:
  contents: read

concurrency:
  group: aether-arena-android
  cancel-in-progress: true

jobs:
  build-android:
    name: Build Aether Arena APK
    runs-on: ubuntu-24.04
    timeout-minutes: 60

    env:
      GODOT_VERSION: "4.3"
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
      PROJECT_ZIP: AetherArena_Phone_Build.zip

    steps:

      # 1. Download repository
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. Install Java
      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # 3. Install required Linux packages
      - name: Install Linux dependencies
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y \
            wget \
            unzip \
            zip \
            python3 \
            p7zip-full

      # 4. Locate Android SDK tools
      - name: Locate Android SDK Manager
        shell: bash
        run: |
          set -euo pipefail

          SDK_ROOT="$ANDROID_HOME"
          mkdir -p "$SDK_ROOT"

          SDKMANAGER="$(find "$SDK_ROOT/cmdline-tools" \
            -type f -name sdkmanager 2>/dev/null | head -n 1 || true)"

          if [ -z "$SDKMANAGER" ]; then
            echo "Android sdkmanager was not found."
            echo "Searching standard runner locations..."

            SDKMANAGER="$(find /usr/local/lib/android \
              -type f -name sdkmanager 2>/dev/null | head -n 1 || true)"
          fi

          if [ -z "$SDKMANAGER" ]; then
            echo "ERROR: sdkmanager is missing."
            exit 1
          fi

          echo "SDKMANAGER=$SDKMANAGER" >> "$GITHUB_ENV"
          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> "$GITHUB_ENV"

          "$SDKMANAGER" --version

      # 5. Accept Android licenses
      - name: Accept Android licenses
        shell: bash
        run: |
          set -euo pipefail

          set +o pipefail
          yes | "$SDKMANAGER" --sdk_root="$ANDROID_HOME" --licenses
          set -o pipefail

      # 6. Install Android SDK packages
      - name: Install Android SDK
        shell: bash
        run: |
          set -euo pipefail

          "$SDKMANAGER" \
            --sdk_root="$ANDROID_HOME" \
            "platform-tools" \
            "platforms;android-34" \
            "build-tools;34.0.0" \
            "cmdline-tools;latest" \
            "ndk;23.2.8568313" \
            "cmake;3.10.2.4988404"

      # 7. Download Godot 4.3
      - name: Install Godot 4.3
        shell: bash
        run: |
          set -euo pipefail

          GODOT_URL="https://github.com/godotengine/godot/releases/download/4.3-stable/Godot_v4.3-stable_linux.x86_64.zip"

          wget -q --show-progress "$GODOT_URL" -O godot.zip

          mkdir -p godot-bin
          unzip -q godot.zip -d godot-bin

          GODOT_BIN="$(find godot-bin -type f \
            -name 'Godot_v4.3-stable_linux.x86_64' | head -n 1)"

          if [ -z "$GODOT_BIN" ]; then
            echo "ERROR: Godot executable not found."
            exit 1
          fi

          chmod +x "$GODOT_BIN"
          sudo install -m 755 "$GODOT_BIN" /usr/local/bin/godot

          godot --version

      # 8. Install matching Godot export templates
      - name: Install Godot Export Templates
        shell: bash
        run: |
          set -euo pipefail

          TEMPLATE_URL="https://github.com/godotengine/godot/releases/download/4.3-stable/Godot_v4.3-stable_export_templates.tpz"

          wget -q --show-progress "$TEMPLATE_URL" -O templates.tpz

          mkdir -p template-temp
          unzip -q templates.tpz -d template-temp

          TEMPLATE_SOURCE="template-temp/templates"

          if [ ! -d "$TEMPLATE_SOURCE" ]; then
            echo "ERROR: Export templates directory is missing."
            find template-temp -maxdepth 3 -type f
            exit 1
          fi

          TEMPLATE_DEST="$HOME/.local/share/godot/export_templates/4.3.stable"

          mkdir -p "$TEMPLATE_DEST"
          cp -a "$TEMPLATE_SOURCE/." "$TEMPLATE_DEST/"

          echo "Godot export templates installed."
          ls -lah "$TEMPLATE_DEST"

      # 9. Extract game project
      - name: Extract Aether Arena project
        shell: bash
        run: |
          set -euo pipefail

          if [ ! -f "$PROJECT_ZIP" ]; then
            echo "ERROR: $PROJECT_ZIP is missing from repository root."
            echo "Repository files:"
            ls -lah
            exit 1
          fi

          mkdir -p "$GITHUB_WORKSPACE/source"

          unzip -q "$PROJECT_ZIP" -d "$GITHUB_WORKSPACE/source"

          PROJECT_FILE="$(find "$GITHUB_WORKSPACE/source" \
            -type f -name project.godot | head -n 1 || true)"

          if [ -z "$PROJECT_FILE" ]; then
            echo "ERROR: project.godot was not found in the ZIP."
            find "$GITHUB_WORKSPACE/source" -maxdepth 4 -type f
            exit 1
          fi

          PROJECT_DIR="$(dirname "$PROJECT_FILE")"

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

          echo "Found project:"
          echo "$PROJECT_DIR"

          ls -lah "$PROJECT_DIR"

      # 10. Configure Android export preset
      - name: Configure Android export preset
        shell: bash
        run: |
          set -euo pipefail

          PRESET="$PROJECT_DIR/export_presets.cfg"

          if [ ! -f "$PRESET" ]; then
            echo "ERROR: export_presets.cfg is missing."
            exit 1
          fi

          python3 - "$PRESET" <<'PY'
          import re
          import sys
          from pathlib import Path

          path = Path(sys.argv[1])
          content = path.read_text(encoding="utf-8")

          sections = re.split(r"(?=^\[)", content, flags=re.M)

          android_index = None

          for i, section in enumerate(sections):
              if not re.match(r"^\[preset\.\d+\]", section):
                  continue

              platform = re.search(
                  r'^platform\s*=\s*"Android"\s*$',
                  section,
                  re.M
              )

              name = re.search(
                  r'^name\s*=\s*"Android"\s*$',
                  section,
                  re.M
              )

              if platform or name:
                  android_index = re.search(
                      r"^\[preset\.(\d+)\]",
                      section,
                      re.M
                  ).group(1)
                  break

          if android_index is None:
              raise SystemExit(
                  "ERROR: Android export preset was not found."
              )

          target_section = f"[preset.{android_index}.options]"

          for i, section in enumerate(sections):
              if section.startswith(target_section):
                  options = section
                  break
          else:
              options = target_section + "\n"
              sections.append(options)
              i = len(sections) - 1

          settings = {
              "gradle_build/use_gradle_build": "true",
              "gradle_build/min_sdk": "23",
              "gradle_build/target_sdk": "34",
          }

          for key, value in settings.items():
              pattern = rf"^{re.escape(key)}\s*=.*$"
              replacement = f"{key}={value}"

              if re.search(pattern, options, re.M):
                  options = re.sub(
                      pattern,
                      replacement,
                      options,
                      flags=re.M
                  )
              else:
                  options += replacement + "\n"

          sections[i] = options
          path.write_text("".join(sections), encoding="utf-8")

          print("Android preset configured:")
          print("\n".join(
              f"{key}={value}"
              for key, value in settings.items()
          ))
          PY

          echo "Android preset updated."

      # 11. Create debug signing key
      - name: Create Android debug keystore
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p "$HOME/.android"

          if [ ! -f "$HOME/.android/debug.keystore" ]; then
            keytool -genkeypair \
              -v \
              -keystore "$HOME/.android/debug.keystore" \
              -storepass android \
              -alias androiddebugkey \
              -keypass android \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
          fi

          echo "GODOT_ANDROID_KEYSTORE_DEBUG_PATH=$HOME/.android/debug.keystore" >> "$GITHUB_ENV"
          echo "GODOT_ANDROID_KEYSTORE_DEBUG_USER=androiddebugkey" >> "$GITHUB_ENV"
          echo "GODOT_ANDROID_KEYSTORE_DEBUG_PASSWORD=android" >> "$GITHUB_ENV"

      # 12. Configure Godot Android SDK paths
      - name: Configure Godot Editor Settings
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p "$HOME/.config/godot"

          cat > "$HOME/.config/godot/editor_settings-4.tres" <<EOF
          [gd_resource type="EditorSettings" format=3]

          [resource]
          export/android/android_sdk_path = "$ANDROID_HOME"
          export/android/java_sdk_path = "$JAVA_HOME"
          export/android/debug_keystore = "$HOME/.android/debug.keystore"
          export/android/debug_keystore_user = "androiddebugkey"
          export/android/debug_keystore_pass = "android"
          EOF

          echo "Godot Android paths configured."

      # 13. Import project resources
      - name: Import Godot project
        shell: bash
        run: |
          set -euo pipefail

          godot --headless \
            --editor \
            --path "$PROJECT_DIR" \
            --quit

      # 14. Install Android Build Template and export APK
      - name: Build Android APK
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p "$GITHUB_WORKSPACE/build"

          echo "Installing Android build template and exporting..."

          godot --headless \
            --path "$PROJECT_DIR" \
            --install-android-build-template \
            --export-debug "Android" \
            "$GITHUB_WORKSPACE/build/AetherArena.apk"

          if [ ! -s "$GITHUB_WORKSPACE/build/AetherArena.apk" ]; then
            echo "ERROR: APK was not generated."
            exit 1
          fi

          echo "APK generated successfully."
          ls -lh "$GITHUB_WORKSPACE/build/AetherArena.apk"

      # 15. Upload APK artifact
      - name: Upload Android APK
        uses: actions/upload-artifact@v4
        with:
          name: AetherArena-Android-APK
          path: build/AetherArena.apk
          if-no-files-found: error
          retention-days: 14
