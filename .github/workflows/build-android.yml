
name: Aether Arena - Android Build

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "AetherArena_Phone_Build.zip"
      - ".github/workflows/build-android.yml"

permissions:
  contents: read

concurrency:
  group: aether-arena-android
  cancel-in-progress: true

jobs:
  build:
    name: Build Aether Arena APK
    runs-on: ubuntu-24.04
    timeout-minutes: 60

    env:
      GODOT_VERSION: "4.3"
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
      PROJECT_ZIP: AetherArena_Phone_Build.zip

    steps:

      # 1. Download repository
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. Install Java 17
      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # 3. Install Linux dependencies
      - name: Install dependencies
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y \
            wget \
            unzip \
            zip \
            python3

      # 4. Find Android SDK
      - name: Configure Android SDK
        shell: bash
        run: |
          set -euo pipefail

          test -d "$ANDROID_HOME"

          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" \
            -type f -name sdkmanager -print -quit)"

          if [ -z "$SDKMANAGER" ]; then
            echo "ERROR: Android SDK manager not found."
            find "$ANDROID_HOME" -maxdepth 5 -type f | head -100
            exit 1
          fi

          echo "SDKMANAGER=$SDKMANAGER" >> "$GITHUB_ENV"

          "$SDKMANAGER" --version
          java -version

      # 5. Accept licenses
      - name: Accept Android licenses
        shell: bash
        run: |
          set -euo pipefail

          set +o pipefail
          yes | "$SDKMANAGER" \
            --sdk_root="$ANDROID_HOME" \
            --licenses
          set -o pipefail

      # 6. Install Android SDK
      - name: Install Android SDK components
        shell: bash
        run: |
          set -euo pipefail

          "$SDKMANAGER" \
            --sdk_root="$ANDROID_HOME" \
            "platform-tools" \
            "platforms;android-34" \
            "build-tools;34.0.0" \
            "cmdline-tools;latest" \
            "ndk;23.2.8568313" \
            "cmake;3.10.2.4988404"

          echo "Android SDK installation completed."

      # 7. Download Godot 4.3
      - name: Install Godot 4.3
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p "$RUNNER_TEMP/godot"
          cd "$RUNNER_TEMP/godot"

          wget -q --show-progress \
            "https://github.com/godotengine/godot-builds/releases/download/4.3-stable/Godot_v4.3-stable_linux.x86_64.zip" \
            -O godot.zip

          unzip -q godot.zip

          test -f Godot_v4.3-stable_linux.x86_64

          chmod +x Godot_v4.3-stable_linux.x86_64

          sudo install -m 755 \
            Godot_v4.3-stable_linux.x86_64 \
            /usr/local/bin/godot

          godot --version

      # 8. Install matching Godot export templates
      - name: Install Godot export templates
        shell: bash
        run: |
          set -euo pipefail

          cd "$RUNNER_TEMP/godot"

          wget -q --show-progress \
            "https://github.com/godotengine/godot-builds/releases/download/4.3-stable/Godot_v4.3-stable_export_templates.tpz" \
            -O templates.tpz

          mkdir -p extracted

          unzip -q templates.tpz -d extracted

          TEMPLATE_SOURCE="$RUNNER_TEMP/godot/extracted/templates"

          TEMPLATE_DEST="$HOME/.local/share/godot/export_templates/4.3.stable"

          test -f "$TEMPLATE_SOURCE/android_debug.apk"

          test -f "$TEMPLATE_SOURCE/android_release.apk"

          mkdir -p "$TEMPLATE_DEST"

          cp -a "$TEMPLATE_SOURCE/." "$TEMPLATE_DEST/"

          echo "Installed Godot Android export templates."

          ls -lh "$TEMPLATE_DEST/android_debug.apk"

      # 9. Extract game project
      - name: Extract Aether Arena project
        shell: bash
        run: |
          set -euo pipefail

          if [ ! -f "$PROJECT_ZIP" ]; then
            echo "ERROR: Project ZIP not found."
            ls -lah
            exit 1
          fi

          mkdir -p "$GITHUB_WORKSPACE/source"

          unzip -q "$PROJECT_ZIP" \
            -d "$GITHUB_WORKSPACE/source"

          PROJECT_FILE="$(find "$GITHUB_WORKSPACE/source" \
            -type f -name project.godot -print -quit)"

          if [ -z "$PROJECT_FILE" ]; then
            echo "ERROR: project.godot not found in ZIP."
            find "$GITHUB_WORKSPACE/source" -maxdepth 5 -type f
            exit 1
          fi

          PROJECT_DIR="$(dirname "$PROJECT_FILE")"

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

          echo "Project directory: $PROJECT_DIR"

          test -f "$PROJECT_DIR/export_presets.cfg"

      # 10. Configure Android preset
      - name: Fix Android export preset
        shell: bash
        run: |
          set -euo pipefail

          python3 - "$PROJECT_DIR/export_presets.cfg" <<'PY'
          import re
          import sys
          from pathlib import Path

          path = Path(sys.argv[1])
          content = path.read_text(encoding="utf-8")

          sections = re.split(
              r"(?=^\[[^\]]+\]\s*$)",
              content,
              flags=re.M
          )

          android_index = None

          for section in sections:
              header = re.match(
                  r"^\[preset\.(\d+)\]",
                  section
              )

              if not header:
                  continue

              if re.search(
                  r'^platform\s*=\s*"Android"\s*$',
                  section,
                  re.M
              ):
                  android_index = header.group(1)
                  break

          if android_index is None:
              raise SystemExit(
                  "ERROR: No Android export preset exists "
                  "in export_presets.cfg."
              )

          options_header = (
              f"[preset.{android_index}.options]"
          )

          options_index = None

          for i, section in enumerate(sections):
              if section.startswith(options_header):
                  options_index = i
                  break

          if options_index is None:
              sections.append(options_header + "\n")
              options_index = len(sections) - 1

          options = sections[options_index]

          # Use standard prebuilt Android templates.
          # Do not use the custom Gradle build.
          options = re.sub(
              r"^gradle_build/min_sdk\s*=.*\n?",
              "",
              options,
              flags=re.M
          )

          options = re.sub(
              r"^gradle_build/target_sdk\s*=.*\n?",
              "",
              options,
              flags=re.M
          )

          gradle_setting = (
              "gradle_build/use_gradle_build=false"
          )

          if re.search(
              r"^gradle_build/use_gradle_build\s*=.*$",
              options,
              re.M
          ):
              options = re.sub(
                  r"^gradle_build/use_gradle_build\s*=.*$",
                  gradle_setting,
                  options,
                  flags=re.M
              )
          else:
              options += "\n" + gradle_setting + "\n"

          sections[options_index] = options

          path.write_text(
              "".join(sections),
              encoding="utf-8"
          )

          print("Android preset index:", android_index)
          print("Gradle Build: disabled")
          print("Min SDK override: removed")
          print("Target SDK override: removed")
          PY

          echo "Final Android export preset:"
          cat "$PROJECT_DIR/export_presets.cfg"

      # 11. Create debug keystore
      - name: Create Android debug keystore
        shell: bash
        run: |
          set -euo pipefail

          keytool -genkeypair -noprompt \
            -keystore "$HOME/debug.keystore" \
            -storepass android \
            -alias androiddebugkey \
            -keypass android \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -dname "CN=Android Debug,O=Android,C=US"

          echo "GODOT_ANDROID_KEYSTORE_DEBUG_PATH=$HOME/debug.keystore" >> "$GITHUB_ENV"
          echo "GODOT_ANDROID_KEYSTORE_DEBUG_USER=androiddebugkey" >> "$GITHUB_ENV"
          echo "GODOT_ANDROID_KEYSTORE_DEBUG_PASSWORD=android" >> "$GITHUB_ENV"

      # 12. Configure Godot SDK paths
      - name: Configure Godot Android paths
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p "$HOME/.config/godot"

          cat > "$HOME/.config/godot/editor_settings-4.tres" <<EOF
          [gd_resource type="EditorSettings" format=3]

          [resource]
          export/android/android_sdk_path = "$ANDROID_HOME"
          export/android/java_sdk_path = "$JAVA_HOME"
          EOF

          echo "Godot SDK paths configured."

      # 13. Import project
      - name: Import Godot project
        shell: bash
        run: |
          set -euo pipefail

          godot --headless \
            --editor \
            --path "$PROJECT_DIR" \
            --import \
            --verbose

      # 14. Verify export templates and preset
      - name: Verify Android configuration
        shell: bash
        run: |
          set -euo pipefail

          TEMPLATE="$HOME/.local/share/godot/export_templates/4.3.stable"

          test -s "$TEMPLATE/android_debug.apk"

          test -s "$TEMPLATE/android_release.apk"

          grep -q 'platform="Android"' \
            "$PROJECT_DIR/export_presets.cfg"

          grep -q 'gradle_build/use_gradle_build=false' \
            "$PROJECT_DIR/export_presets.cfg"

          echo "Android configuration verified."

      # 15. Export APK with detailed logs
      - name: Export Aether Arena APK
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p "$GITHUB_WORKSPACE/build"

          APK="$GITHUB_WORKSPACE/build/AetherArena.apk"

          echo "Starting standard Android APK export."

          godot --headless \
            --verbose \
            --path "$PROJECT_DIR" \
            --export-debug "Android" \
            "$APK" \
            2>&1 | tee "$GITHUB_WORKSPACE/build/export.log"

          if [ ! -s "$APK" ]; then
            echo "ERROR: APK was not generated."
            exit 1
          fi

          unzip -t "$APK"

          echo "APK export successful."
          ls -lh "$APK"

      # 16. Upload APK
      - name: Upload Android APK
        uses: actions/upload-artifact@v4
        with:
          name: AetherArena-Android-APK
          path: build/AetherArena.apk
          if-no-files-found: error
          retention-days: 14

      # 17. Upload diagnostic log if build fails
      - name: Upload build diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: AetherArena-Build-Diagnostics
          path: |
            build/export.log
            source/**/export_presets.cfg
          if-no-files-found: ignore
          retention-days: 7
