
name: Build Aether Arena APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - name: Download repository
        uses: actions/checkout@v4

      - name: Install Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android components
        run: |
          yes | sdkmanager --licenses || true
          sdkmanager --install \
            "platform-tools" \
            "platforms;android-34" \
            "build-tools;34.0.0" \
            "cmdline-tools;latest" \
            "cmake;3.10.2.4988404" \
            "ndk;23.2.8568313"

      - name: Install Godot 4.3 and export templates
        run: |
          mkdir -p "$RUNNER_TEMP/godot"
          cd "$RUNNER_TEMP/godot"

          wget -q https://github.com/godotengine/godot-builds/releases/download/4.3-stable/Godot_v4.3-stable_linux.x86_64.zip
          wget -q https://github.com/godotengine/godot-builds/releases/download/4.3-stable/Godot_v4.3-stable_export_templates.tpz

          unzip -q Godot_v4.3-stable_linux.x86_64.zip
          sudo install Godot_v4.3-stable_linux.x86_64 /usr/local/bin/godot

          mkdir -p "$HOME/.local/share/godot/export_templates/4.3.stable"
          mkdir templates
          unzip -q Godot_v4.3-stable_export_templates.tpz -d templates
          cp -a templates/templates/. "$HOME/.local/share/godot/export_templates/4.3.stable/"

      - name: Configure Android signing
        run: |
          keytool -genkeypair \
            -keystore "$HOME/debug.keystore" \
            -storepass android \
            -alias androiddebugkey \
            -keypass android \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -dname "CN=Android Debug,O=Android,C=US"

          mkdir -p "$HOME/.config/godot"

          cat > "$HOME/.config/godot/editor_settings-4.tres" <<EOF
          [gd_resource type="EditorSettings" format=3]

          [resource]
          export/android/java_sdk_path = "$JAVA_HOME"
          export/android/android_sdk_path = "$ANDROID_HOME"
          export/android/debug_keystore = "$HOME/debug.keystore"
          export/android/debug_keystore_user = "androiddebugkey"
          export/android/debug_keystore_pass = "android"
          EOF

      - name: Extract game project
        run: |
          mkdir -p source
          unzip -q AetherArena_Phone_Build.zip -d source

          PROJECT_FILE="$(find source -name project.godot -print -quit)"
          if [ -z "$PROJECT_FILE" ]; then
            echo "ERROR: project.godot was not found"
            find source -maxdepth 4 -type f
            exit 1
          fi

          echo "PROJECT_DIR=$(dirname "$PROJECT_FILE")" >> "$GITHUB_ENV"

      - name: Import Godot project
        run: |
          godot --headless --editor --path "$PROJECT_DIR" --quit

      - name: Build Android APK
        run: |
          mkdir -p build
          godot --headless \
            --path "$PROJECT_DIR" \
            --export-debug "Android" \
            "$GITHUB_WORKSPACE/build/AetherArena.apk"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: AetherArena-Android-APK
          path: build/AetherArena.apk
